<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4d4a4"/>
      <stop offset="50%" stop-color="#8fa366"/>
      <stop offset="100%" stop-color="#4e5c24"/>
    </linearGradient>
    <filter id="softShadowTube" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#374011" flood-opacity="0.15"/>
    </filter>
  </defs>
  <circle cx="100" cy="105" r="75" fill="#f4f6ee" />
  <circle cx="100" cy="105" r="62" fill="#d8dec2" opacity="0.6" />

  <g filter="url(#softShadowTube)">
    <!-- Flip Cap (At the bottom of the tube) -->
    <rect x="80" y="152" width="40" height="16" rx="4" fill="#374011" stroke="#7f8f55" stroke-width="1.5" />
    <line x1="80" y1="160" x2="120" y2="160" stroke="#7f8f55" stroke-width="1" />

    <!-- Tube Body (Tapered from crimp at top to cap at bottom) -->
    <path d="M68,36 L132,36 C132,36 124,136 116,152 L84,152 C76,136 68,36 68,36 Z" fill="url(#tubeGrad)" stroke="#ffffff" stroke-width="2" />
    
    <!-- Top Crimp -->
    <rect x="66" y="32" width="68" height="8" rx="2" fill="#4e5c24" />
    <line x1="72" y1="36" x2="128" y2="36" stroke="#a9b48a" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Label Plate on Tube -->
    <rect x="76" y="62" width="48" height="66" rx="6" fill="#ffffff" stroke="#d8dec2" stroke-width="1.5" opacity="0.95" />
    
    <!-- Botanical Water Droplet Motif -->
    <path d="M100,72 C105,79 108,84 108,88 C108,93 104,96 100,96 C96,96 92,93 92,88 C92,84 95,79 100,72 Z" fill="#7f8f55" />
    <circle cx="98" cy="85" r="1.5" fill="#ffffff" />

    <text x="100" y="106" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="900" fill="#374011" text-anchor="middle">DHAARA</text>
    <text x="100" y="115" font-family="-apple-system, sans-serif" font-size="4.5" font-weight="700" fill="#7f8f55" text-anchor="middle">FACE WASH</text>
    <text x="100" y="123" font-family="-apple-system, sans-serif" font-size="4" font-weight="600" fill="#374011" text-anchor="middle">100 ML • PURIFYING</text>
  </g>
</svg>