<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="comboGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a9b48a"/>
      <stop offset="50%" stop-color="#7f8f55"/>
      <stop offset="100%" stop-color="#374011"/>
    </linearGradient>
    <filter id="softShadowCombo" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#374011" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Aura -->
  <circle cx="100" cy="105" r="80" fill="#f4f6ee" />
  <circle cx="100" cy="105" r="66" fill="#d8dec2" opacity="0.6" />
  
  <!-- Left Bottle -->
  <g filter="url(#softShadowCombo)" transform="translate(-18, 5) scale(0.9)">
    <rect x="85" y="32" width="28" height="16" rx="3" fill="#6d7d45" />
    <path d="M88,48 L110,48 L114,66 L84,66 Z" fill="#7f8f55" opacity="0.8" />
    <rect x="70" y="66" width="58" height="88" rx="12" fill="#ffffff" stroke="#7f8f55" stroke-width="2" />
    <rect x="73" y="76" width="52" height="74" rx="8" fill="url(#comboGrad)" opacity="0.8" />
    <rect x="75" y="88" width="48" height="42" rx="3" fill="#ffffff" stroke="#d8dec2" />
    <text x="99" y="108" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="900" fill="#374011" text-anchor="middle">DHAARA</text>
    <text x="99" y="117" font-family="-apple-system, sans-serif" font-size="4.5" font-weight="700" fill="#7f8f55" text-anchor="middle">200 ML</text>
  </g>

  <!-- Right Bottle -->
  <g filter="url(#softShadowCombo)" transform="translate(38, 5) scale(0.9)">
    <rect x="85" y="32" width="28" height="16" rx="3" fill="#6d7d45" />
    <path d="M88,48 L110,48 L114,66 L84,66 Z" fill="#7f8f55" opacity="0.8" />
    <rect x="70" y="66" width="58" height="88" rx="12" fill="#ffffff" stroke="#7f8f55" stroke-width="2" />
    <rect x="73" y="76" width="52" height="74" rx="8" fill="url(#comboGrad)" opacity="0.8" />
    <rect x="75" y="88" width="48" height="42" rx="3" fill="#ffffff" stroke="#d8dec2" />
    <text x="99" y="108" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="900" fill="#374011" text-anchor="middle">DHAARA</text>
    <text x="99" y="117" font-family="-apple-system, sans-serif" font-size="4.5" font-weight="700" fill="#7f8f55" text-anchor="middle">200 ML</text>
  </g>

  <!-- Combo Ribbon / Badge -->
  <g filter="url(#softShadowCombo)">
    <rect x="62" y="146" width="76" height="20" rx="10" fill="#7f8f55" stroke="#ffffff" stroke-width="2" />
    <text x="100" y="160" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">COMBO 2-PACK</text>
  </g>
</svg>
