    <rect x="58" y="150" width="84" height="20" rx="10" fill="#7f8f55" stroke="#ffffff" stroke-width="2" />
    <text x="100" y="163" font-family="-apple-system, sans-serif" font-size="7" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SHAMPOO 2-PACK</text>
