    <rect x="90" y="36" width="20" height="10" rx="2" fill="#556228" />
    <rect x="70" y="62" width="60" height="92" rx="14" fill="#ffffff" stroke="#7a8b4b" stroke-width="2" />
    <rect x="73" y="72" width="54" height="78" rx="10" fill="url(#shampooGradC)" opacity="0.85" />
    <rect x="75" y="85" width="50" height="48" rx="3" fill="#ffffff" stroke="#d8dec2" />
    <text x="100" y="106" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="900" fill="#374011" text-anchor="middle">DHAARA</text>
    <text x="100" y="115" font-family="-apple-system, sans-serif" font-size="4.5" font-weight="700" fill="#7a8b4b" text-anchor="middle">SHAMPOO</text>
    <text x="100" y="124" font-family="-apple-system, sans-serif" font-size="4.2" font-weight="600" fill="#374011" text-anchor="middle">200 ML</text>
  </g>

  <!-- Right Bottle -->
  <g filter="url(#softShadowSC)" transform="translate(36, 6) scale(0.88)">
    <path d="M96,20 L118,20 C122,20 124,23 120,26 L104,26 L104,36 L96,36 Z" fill="#556228" />
    <rect x="90" y="36" width="20" height="10" rx="2" fill="#556228" />
    <rect x="70" y="62" width="60" height="92" rx="14" fill="#ffffff" stroke="#7a8b4b" stroke-width="2" />
    <rect x="73" y="72" width="54" height="78" rx="10" fill="url(#shampooGradC)" opacity="0.85" />
    <rect x="75" y="85" width="50" height="48" rx="3" fill="#ffffff" stroke="#d8dec2" />
    <text x="100" y="106" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="900" fill="#374011" text-anchor="middle">DHAARA</text>
    <text x="100" y="115" font-family="-apple-system, sans-serif" font-size="4.5" font-weight="700" fill="#7a8b4b" text-anchor="middle">SHAMPOO</text>
    <text x="100" y="124" font-family="-apple-system, sans-serif" font-size="4.2" font-weight="600" fill="#374011" text-anchor="middle">200 ML</text>
