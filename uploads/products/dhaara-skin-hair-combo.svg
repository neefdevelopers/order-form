<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8c798"/>
      <stop offset="50%" stop-color="#7f8f55"/>
      <stop offset="100%" stop-color="#374011"/>
    </linearGradient>
    <filter id="softShadowSHC" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#374011" flood-opacity="0.15"/>
    </filter>
  </defs>
  <circle cx="100" cy="105" r="82" fill="#f4f6ee" />
  <circle cx="100" cy="105" r="68" fill="#d8dec2" opacity="0.6" />

  <!-- Left: Oil Bottle -->
  <g filter="url(#softShadowSHC)" transform="translate(-30, 8) scale(0.8)">
    <rect x="85" y="30" width="30" height="18" rx="3" fill="#6d7d45" />
    <path d="M88,48 L112,48 L116,68 L84,68 Z" fill="#7f8f55" opacity="0.8" />
    <rect x="70" y="68" width="60" height="92" rx="14" fill="#ffffff" stroke="#7f8f55" stroke-width="2" />
    <rect x="73" y="78" width="54" height="78" rx="10" fill="url(#shcGrad)" opacity="0.85" />
    <rect x="75" y="90" width="50" height="42" rx="3" fill="#ffffff" stroke="#d8dec2" />
    <text x="100" y="112" font-family="-apple-system, sans-serif" font-size="7" font-weight="900" fill="#374011" text-anchor="middle">OIL</text>
  </g>

  <!-- Right: Face Wash Tube -->
  <g filter="url(#softShadowSHC)" transform="translate(32, 8) scale(0.8)">
    <rect x="80" y="152" width="40" height="16" rx="4" fill="#374011" stroke="#7f8f55" stroke-width="1.5" />
    <path d="M68,36 L132,36 C132,36 124,136 116,152 L84,152 C76,136 68,36 68,36 Z" fill="url(#shcGrad)" stroke="#ffffff" stroke-width="2" />
    <rect x="66" y="32" width="68" height="8" rx="2" fill="#4e5c24" />
    <rect x="76" y="65" width="48" height="55" rx="6" fill="#ffffff" stroke="#d8dec2" opacity="0.95" />
    <text x="100" y="98" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="900" fill="#374011" text-anchor="middle">FACE</text>
    <text x="100" y="108" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="900" fill="#7f8f55" text-anchor="middle">WASH</text>
  </g>

  <!-- Center: Shampoo Bottle -->
  <g filter="url(#softShadowSHC)" transform="translate(0, 0) scale(0.9)">
    <path d="M96,18 L118,18 C122,18 124,21 120,24 L104,24 L104,34 L96,34 Z" fill="#556228" />
    <rect x="88" y="34" width="24" height="12" rx="2" fill="#556228" />
    <rect x="68" y="64" width="64" height="96" rx="14" fill="#ffffff" stroke="#7a8b4b" stroke-width="2" />
    <rect x="71" y="74" width="58" height="82" rx="10" fill="url(#shcGrad)" opacity="0.85" />
    <rect x="73" y="88" width="54" height="48" rx="3" fill="#ffffff" stroke="#d8dec2" />
    <text x="100" y="110" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="900" fill="#374011" text-anchor="middle">DHAARA</text>
    <text x="100" y="120" font-family="-apple-system, sans-serif" font-size="4.8" font-weight="700" fill="#7a8b4b" text-anchor="middle">SHAMPOO</text>
  </g>

  <!-- Combo Badge -->
  <g filter="url(#softShadowSHC)">
    <rect x="42" y="152" width="116" height="20" rx="10" fill="#7f8f55" stroke="#ffffff" stroke-width="2" />
    <text x="100" y="165" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">HAIR &amp; SKIN COMPLETE</text>
  </g>
</svg>
