<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="oilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a9b48a"/>
      <stop offset="50%" stop-color="#7f8f55"/>
      <stop offset="100%" stop-color="#374011"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d7d45"/>
      <stop offset="50%" stop-color="#8c9c60"/>
      <stop offset="100%" stop-color="#4d592a"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#374011" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Aura -->
  <circle cx="100" cy="105" r="75" fill="#f4f6ee" />
  <circle cx="100" cy="105" r="62" fill="#d8dec2" opacity="0.6" />
  
  <!-- Bottle Group with shadow -->
  <g filter="url(#softShadow)">
    <!-- Cap -->
    <rect x="85" y="30" width="30" height="18" rx="3" fill="url(#capGrad)" />
    <!-- Neck -->
    <path d="M88,48 L112,48 L116,68 L84,68 Z" fill="#7f8f55" opacity="0.8" />
    <!-- Bottle Body -->
    <rect x="70" y="68" width="60" height="92" rx="14" fill="#ffffff" stroke="#7f8f55" stroke-width="2" />
    <!-- Oil liquid inside -->
    <rect x="73" y="80" width="54" height="76" rx="10" fill="url(#oilGrad)" opacity="0.85" />
    
    <!-- Bottle Label -->
    <rect x="75" y="92" width="50" height="48" rx="4" fill="#ffffff" stroke="#d8dec2" stroke-width="1.5" />
    <!-- Label Brand Text & Leaf Motif -->
    <path d="M100,98 C105,95 110,99 108,104 C104,109 98,107 100,98 Z" fill="#7f8f55" />
    <path d="M100,98 C95,95 90,99 92,104 C96,109 102,107 100,98 Z" fill="#a9b48a" />
    
    <text x="100" y="117" font-family="-apple-system, sans-serif" font-size="7" font-weight="900" fill="#374011" text-anchor="middle" letter-spacing="0.5">DHAARA</text>
    <text x="100" y="125" font-family="-apple-system, sans-serif" font-size="5" font-weight="700" fill="#7f8f55" text-anchor="middle">HERBAL OIL</text>
    <text x="100" y="133" font-family="-apple-system, sans-serif" font-size="4.5" font-weight="600" fill="#374011" text-anchor="middle">100 ML</text>
  </g>
</svg>
