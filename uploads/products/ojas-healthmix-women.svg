<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="jarGradWomen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a4238"/>
      <stop offset="50%" stop-color="#3d2c25"/>
      <stop offset="100%" stop-color="#241a16"/>
    </linearGradient>
    <linearGradient id="lidGradWomen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d49b82"/>
      <stop offset="50%" stop-color="#e8beac"/>
      <stop offset="100%" stop-color="#b87d64"/>
    </linearGradient>
    <filter id="softShadowJarW" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#374011" flood-opacity="0.15"/>
    </filter>
  </defs>
  <circle cx="100" cy="105" r="75" fill="#f4f6ee" />
  <circle cx="100" cy="105" r="62" fill="#d8dec2" opacity="0.6" />

  <g filter="url(#softShadowJarW)">
    <!-- Lid (Rose-gold / warm bronze accent) -->
    <rect x="68" y="38" width="64" height="18" rx="5" fill="url(#lidGradWomen)" stroke="#8c5844" stroke-width="1.5" />
    <line x1="72" y1="46" x2="128" y2="46" stroke="#ffffff" stroke-width="1" opacity="0.6" />

    <!-- Jar Neck -->
    <rect x="74" y="56" width="52" height="10" fill="#3d2c25" />

    <!-- Jar Body -->
    <rect x="60" y="66" width="80" height="96" rx="16" fill="url(#jarGradWomen)" stroke="#b87d64" stroke-width="2" />

    <!-- Jar Label -->
    <rect x="64" y="80" width="72" height="64" rx="6" fill="#ffffff" stroke="#d8dec2" stroke-width="1.5" />
    
    <!-- Lotus / Wellness Emblem -->
    <path d="M100,86 C105,92 108,98 100,102 C92,98 95,92 100,86 Z" fill="#b87d64" />
    <path d="M96,93 C90,95 86,100 93,103 C97,101 98,97 96,93 Z" fill="#d49b82" />
    <path d="M104,93 C110,95 114,100 107,103 C103,101 102,97 104,93 Z" fill="#d49b82" />

    <text x="100" y="112" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="900" fill="#374011" text-anchor="middle" letter-spacing="0.5">OJAS</text>
    <text x="100" y="122" font-family="-apple-system, sans-serif" font-size="5" font-weight="700" fill="#b87d64" text-anchor="middle">HEALTH MIX</text>
    <text x="100" y="132" font-family="-apple-system, sans-serif" font-size="4.8" font-weight="800" fill="#5a4238" text-anchor="middle">WOMEN'S WELLNESS</text>
  </g>
</svg>
